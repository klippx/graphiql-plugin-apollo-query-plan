name: Renovate

on:
  workflow_dispatch:
    inputs:
      log_level:
        description: "Log level for Renovate, e.g., `info` (default), `debug`"
        required: false
        type: string
      log_format:
        description: "Log format for Renovate, e.g., `pretty` (default), `json`"
        required: false
        type: string

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@1a96852b0384df1837619d04c60b2d10d1f9ff08 # v46.1.21
        env:
          RENOVATE_REPOSITORIES: klippx/graphiql-plugin-apollo-query-plan
          LOG_LEVEL: ${{ inputs.log_level }}
          LOG_FORMAT: ${{ inputs.log_format }}
        with:
          configurationFile: .github/renovate.json
          token: ${{ secrets.RENOVATE_PAT }}
